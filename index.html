<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>श्री राधा नाम जप काउंटर</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #fff5e6; padding: 20px; display: flex; justify-content: center; align-items: center; height: 90vh; margin: 0; }
        .counter-box { background: white; padding: 40px 30px; border-radius: 24px; box-shadow: 0 10px 25px rgba(255, 111, 0, 0.15); max-width: 400px; width: 100%; border: 2px solid #ffe0cc; }
        h1 { color: #ff6f00; font-size: 2.5rem; margin: 0 0 10px 0; letter-spacing: 1px; }
        .mantra { color: #db2777; font-size: 1.5rem; font-weight: bold; margin-bottom: 25px; }
        .count { font-size: 5.5rem; font-weight: 800; color: #1e293b; margin: 20px 0; font-variant-numeric: tabular-nums; }
        .tap-btn { background: linear-gradient(135deg, #ff9e00 0%, #ff6f00 100%); color: white; border: none; padding: 20px; width: 100%; font-size: 1.8rem; font-weight: bold; border-radius: 16px; cursor: pointer; box-shadow: 0 6px 20px rgba(255, 111, 0, 0.4); transition: transform 0.1s; -webkit-tap-highlight-color: transparent; }
        .tap-btn:active { transform: scale(0.96); }
        .footer-btns { display: flex; justify-content: space-between; margin-top: 30px; }
        .btn-sub { background: #e2e8f0; color: #475569; border: none; padding: 8px 16px; font-size: 0.9rem; border-radius: 8px; cursor: pointer; font-weight: 500; }
    </style>
</head>
<body>

    <div class="counter-box">
        <h1>श्री राधा</h1>
        <div class="mantra">॥ राधा राधा राधा ॥</div>
        <div class="count" id="japCount">0</div>
        <button class="tap-btn" onclick="incrementCount()">जप करें (TAP)</button>
        
        <div class="footer-btns">
            <button class="btn-sub" onclick="decrementCount()">-1 (Galti Sudharein)</button>
            <button class="btn-sub" style="background: #fee2e2; color: #dc2626;" onclick="resetCount()">Reset</button>
        </div>
    </div>

    <script>
        let count = localStorage.getItem('radha_jap_count') ? parseInt(localStorage.getItem('radha_jap_count')) : 0;
        document.getElementById('japCount').innerText = count;

        // Audio Object Create Kiya (Filename: radha.mp3)
        const radhaSound = new Audio('radha.mp3');

        function incrementCount() {
            count++;
            updateDisplay();
            
            // Sound Play Logic
            radhaSound.currentTime = 0; // Audio ko start se reset karega taki fast tap par sound kate nahi
            radhaSound.play().catch(function(error) {
                console.log("Audio play blocked by browser policy until first interaction.");
            });

            // Phone vibration feel ke liye
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function decrementCount() {
            if (count > 0) {
                count--;
                updateDisplay();
            }
        }

        function resetCount() {
            if(confirm("क्या आप अपना काउंटर जीरो (0) करना चाहते हैं?")) {
                count = 0;
                updateDisplay();
            }
        }

        function updateDisplay() {
            document.getElementById('japCount').innerText = count;
            localStorage.setItem('radha_jap_count', count);
        }
    </script>

</body>
</html>
